<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The terminal portfolio of Erke Canbazoglu, software engineer."
    />
    <title>erke@portfolio:~</title>
  </head>
  <body>
    <main class="page-shell">
      <div class="theme-switch page-theme-switch" role="group" aria-label="Colour theme">
        <button class="theme-icon" type="button" data-theme="light" aria-label="Use light theme" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
        </button>
        <button class="theme-icon" type="button" data-theme="dark" aria-label="Use dark theme" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 15.4A8.5 8.5 0 0 1 8.6 3.3 8.5 8.5 0 1 0 20.7 15.4Z"></path></svg>
        </button>
      </div>
      <section class="terminal" aria-label="Erke Canbazoglu's interactive portfolio terminal">
        <header class="terminal-bar">
          <div class="window-controls" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <p>erke@portfolio: <span id="window-path">~</span></p>
        </header>
        <div id="terminal-output" class="terminal-output" aria-live="polite"></div>
        <form id="command-form" class="command-line">
          <label class="prompt" for="command-input">
            <span class="user">erke</span><span>@</span><span class="host">portfolio</span><span>:</span><span id="prompt-path">~</span><span>$</span>
          </label>
          <input
            id="command-input"
            autocomplete="off"
            autocapitalize="off"
            autofocus
            spellcheck="false"
            aria-label="Terminal command"
          />
        </form>
      </section>
      <p class="hint">Try <button type="button" data-command="help">help</button>, <button type="button" data-command="neofetch">neofetch</button>, or <button type="button" data-command="ls">ls</button>.</p>
      <nav class="social-strip" aria-label="Contact links">

        </a>
        <a class="social-link" href="https://www.linkedin.com/in/erkecanbazoglu/" target="_blank" rel="noreferrer" aria-label="LinkedIn profile">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.5 8.2H3.2V21h3.3V8.2ZM4.85 3A1.93 1.93 0 1 0 4.9 6.86 1.93 1.93 0 0 0 4.85 3ZM20.8 13.66c0-3.86-2.06-5.66-4.8-5.66a4.15 4.15 0 0 0-3.73 2.05V8.2H9V21h3.27v-6.34c0-1.67.32-3.29 2.39-3.29 2.04 0 2.07 1.91 2.07 3.4V21H20v-6.34c0-.35 0-.69-.02-1Z"></path></svg>

      </nav>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
